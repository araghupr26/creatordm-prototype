function chat(id){
  const all=[...S.data.friends,...S.data.creators]; const th=all.find(x=>x.id===id)||{name:id,c:'coral',pv:''};
  const creator=!S.data.friends.some(x=>x.id===id);
  let inner='';
  if(id==='fitwithtara'){
    const msgs=S.msgs.length?S.msgs:T3();
    const lastBtn=msgs.map((m,i)=>m.b&&m.k==='in'?i:-1).reduce((a,b)=>Math.max(a,b),-1);
    const lastOut=msgs.map((m,i)=>m.k==='out'?i:-1).reduce((a,b)=>Math.max(a,b),-1);
    inner=msgs.map((m,i)=>{
      if(m.k==='date') return `<div class="date">${m.t}</div>`;
      if(m.k==='sys') return `<div class="sys"><a>fitwithtara</a> messaged you about a comment you made on their post.<br><a data-a="seepost">See Post</a></div>`;
      if(m.k==='out') return `<div class="out">${m.t}</div>`;
      if(m.k==='typing') return `<div class="inr"><div class="sp"></div><div class="b typing"><i></i><i></i><i></i></div></div>`;
      const active=m.b&&i===lastBtn&&lastOut<i&&S.msgs.length;
      const next=msgs[i+1]; const showAv=!(next&&next.k==='in');
      return `<div class="inr">${showAv?av(th.name,th.c,28):'<div class="sp"></div>'}<div class="stk"><div class="b ${m.hl&&S.hl?'hl':''} ${m.noise?'noise':''}" ${m.hl?'id="hlmsg"':''}>${m.t}${m.link?`<a class="lnk" data-a="cb" data-v="open">${m.link}</a>`:''}${m.b?`<div class="bt">${m.b.map(b=>`<button class="${active?'':'off'}" ${active?`data-a="cb" data-v="${b.a}"`:''}>${b.l}</button>`).join('')}</div>`:''}</div>${m.noise&&S.mode==='after'?`<div class="nt">${ic('check',11,'var(--tx2)')}Tucked away in DM to Link</div>`:''}</div></div>`;
    }).join('');
  } else if(id==='emily') inner=`<div class="date">TODAY</div><div class="inr">${av('Emily','coral',28)}<div class="b">are we still on for saturday??</div></div><div class="out">yes! 7pm at the usual place</div><div class="inr">${av('Emily','coral',28)}<div class="b">perfect, see you there</div></div>`;
  else inner=`<div class="date">TODAY</div><div class="inr">${av(th.name,th.c,28)}<div class="b ${creator?'noise':''}">${th.pv}</div></div>`;
  const fol=S.following&&id==='fitwithtara';
  const intro=creator?`<div class="intro">${av(th.name,th.c,84,true)}<b>${th.name}</b><div class="h">${th.name}</div><div class="h">7.5K followers · 53 posts</div><div class="h">${fol?'You follow this account':"You don't follow each other on Instagram"}</div><button class="fbtn ${fol?'on':''}" data-a="follow-t">${fol?'Following':'Follow'}</button></div>`:'';
  return `<div class="col">${status()}<div class="hdr" style="gap:14px"><button data-a="back">${ic('back',26)}</button>${av(th.name,th.c,40,creator)}<div class="cname"><b>${creator&&S.alias['@'+th.name]?S.alias['@'+th.name]:th.name}</b><span>${creator?th.name:'Active now'}</span></div>${ic('plusc',26)}${ic('phone',24)}${ic('video',26)}</div>
  ${creator?`<div class="pills"><button>Inquire</button><button>View Profile</button></div>`:''}
  <div class="body" id="body" style="padding-bottom:110px">${intro}<div class="msgs">${inner}</div></div></div>
  <div class="inputbar"><span class="cam">${ic('camera',22,'#fff')}</span><span class="ph">Message…</span>${ic('mic',24,'var(--tx)')}${ic('image',24,'var(--tx)')}${ic('sticker',24,'var(--tx)')}${ic('plusc',26,'var(--tx)')}</div>`;
}

  const nz=r.noise.sent+r.noise.promo;
  return `<div class="scrim" data-a="close"></div><div class="sheet"><div class="hd"></div><div class="big" style="background:${col(r.color)}"><span class="pl">${ic(r.type==='reel'?'play':'image',12,'#fff',r.type==='reel')}</span>${r.thumb}</div>
  <div><div class="tt">${rt(r)}</div><div class="fr">${r.alias?'Original: '+r.title+' · ':''}${r.type==='reel'?'Reel':'Post'} from ${dn(r.by)}, ${r.date}${r.tags.length?' · '+r.tags.join(', '):''}</div></div><div class="lr"><button data-a="label" data-v="res:${r.id}">${ic('compose',14,'var(--tx)')}${r.alias?'Edit label':'Add label'}</button><button data-a="creator" data-v="${r.by}">${ic('profile',14,'var(--tx)')}${dn(r.by)} · ${S.data.res.filter(x=>x.by===r.by).length} resources</button></div><div class="sm">${r.sum}</div>${r.src==='msg'?`<div class="quote">${r.msgText}</div><button class="btn s" data-a="copy">Copy text</button>`:''}<div class="src">${note}</div><div class="ln ${none?'dim':''}">${linkLine}</div>${r.more?`<div class="src">+${r.more.length} more link in the same message (${r.more.map(m=>m.l+': '+m.u).join(', ')}). The first link is the resource.</div>`:''}
  ${nz?`<div class="nz">${ic('check',14,'var(--tx2)')}<span>${nz} automated messages from this chat are tucked away: ${r.noise.sent?r.noise.sent+' "Sent ✨"':''}${r.noise.sent&&r.noise.promo?', ':''}${r.noise.promo?r.noise.promo+' follow-up promos':''}.</span></div>`:''}
  <div class="act">${none?'':`<button class="btn p" data-a="open" data-v="${r.id}">Open link</button>`}<button class="btn ${none?'p':'s'}" data-a="gochat" data-v="${r.id}">Go to chat</button></div>
  <button class="btn o" data-a="pin" data-v="${r.id}">${r.pinned?'Pinned':'Pin'}</button></div>`;
}
const topicsSheet=()=>`<div class="scrim" data-a="close"></div><div class="sheet"><div class="hd"></div><div class="ttl2">Your topics</div><div class="cp">Topics come from the reels and posts you comment on. Turn any off to hide its row.</div><div class="tg">${S.topics.map(t=>`<button class="${t.on?'on':''}" data-a="topic" data-v="${t.n}">${t.on?ic('check',14,'currentColor'):''}${t.n}</button>`).join('')}</div><button class="btn p" data-a="close">Done</button></div>`;
const tuckSheet=()=>`<div class="scrim" data-a="close"></div><div class="sheet"><div class="hd"></div><div class="ttl2">Tucked away</div><div class="cp">DM to Link keeps automated noise out of your way. Nothing is deleted. Each message is still in its chat.</div>
  <div><div class="nzrow"><span>"Sent ✨" and "Check your DMs 📩" replies</span><span>14</span></div><div class="nzrow"><span>Follow-up promos</span><span>9</span></div><div class="nzrow"><span>Reminders and expiry nudges</span><span>5</span></div><div class="nzrow"><span>Your own button taps</span><span>3</span></div></div>
  <div class="cp">Public "Sent ✨" replies under your comments stay in the post's comments and notifications.</div><button class="btn p" data-a="close">Got it</button></div>`;

/* ---------- render + events ---------- */
function markup(){
  const c=cur(); let h='';
  if(c==='feed')h=feed(); else if(c==='inbox')h=inbox(); else if(c==='stuff')h=stuff(); else if(c.startsWith('cat:'))h=seeall(c.slice(4)); else if(c.startsWith('cr:'))h=creatorScreen(c.slice(3)); else if(c.startsWith('chat:'))h=chat(c.slice(5));
  const notif=S.notif==='reply'?`<div class="notif" data-a="opennotif">${av('fitwithtara','coral',40,true)}<div class="m"><b>fitwithtara</b> replied to your comment: Sent ✨<div class="n">now</div></div></div>`:S.notif==='dm'?`<div class="notif" data-a="opennotif">${av('fitwithtara','coral',40,true)}<div class="m"><b>fitwithtara</b> messaged you about your comment<div class="n">now</div></div></div>`:'';
  return `<div class="island"></div>${h}${S.comments?commentsSheet():''}${S.sheet?sheet():''}${S.topicsSheet?topicsSheet():''}${S.label?labelSheet():''}${S.tuckSheet?tuckSheet():''}${notif}${S.toast?`<div class="toast">${S.toast}</div>`:''}`;
}
function render(keep=true){
  const scr=document.getElementById('screen'); scr.dataset.t=THEME;
  const old=document.getElementById('body'); const st=old&&keep?old.scrollTop:0; const c=cur();
  scr.innerHTML=markup();
  const b=document.getElementById('body'); if(b) b.scrollTop=st;
  if(c.startsWith('chat:')&&b&&!S.hl) b.scrollTop=b.scrollHeight;
  if(S.flash){ const el=document.querySelector(`[data-id="${S.flash}"]`); if(el) el.scrollIntoView({block:'center'}); }
  if(S.hl){ const el=document.getElementById('hlmsg'); if(el) el.scrollIntoView({block:'center'}); }
  if(S.searchMode){ const q=document.getElementById('q'); if(q&&document.activeElement!==q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
  if(S.label){ const l=document.getElementById('lin'); if(l&&document.activeElement!==l){ l.focus(); l.setSelectionRange(l.value.length,l.value.length); } }
  panel();
}
const scr=document.getElementById('screen');
scr.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return; const a=t.dataset.a,v=t.dataset.v;
  if(a==='go') S.stack.push(v);
  else if(a==='tab'){ if(v==='home') S.stack=['feed']; else if(v==='inbox') S.stack=['inbox']; else toast('Not part of this prototype'); S.notif=null; S.sheet=null; S.comments=false; S.searchMode=false; }
  else if(a==='back'){ if(S.stack.length>1) S.stack.pop(); S.hl=false; }
  else if(a==='chat'){ S.stack.push('chat:'+v); S.hl=false; if(v==='fitwithtara'&&!S.msgs.length) S.msgs=T3(); }
  else if(a==='comments'){ S.comments=true; S.notif=null; }
  else if(a==='fill'){ S.draft=v; render(false); const i=document.getElementById('cin'); if(i){i.focus();i.setSelectionRange(v.length,v.length);} return; }
  else if(a==='post'){ if(!S.draft.trim()) return; S.postedText=S.draft.trim(); const hit=/guide/i.test(S.postedText); S.commented=true; S.draft='';
    if(hit){ S.msgs=T0(); setTimeout(()=>{S.replied=true;render();},900); setTimeout(()=>{S.notif='reply';render();},1800); setTimeout(()=>{S.notif='dm';render();},4600); } else toast('Posted'); }
  else if(a==='opennotif'){ if(S.notif==='reply'){ S.notif=null; S.comments=true; } else { S.notif=null; S.comments=false; S.stack=['feed','inbox','chat:fitwithtara']; S.hl=false; } }
  else if(a==='seepost') S.stack=['feed'];
  else if(a==='follow-t') S.following=!S.following;
  else if(a==='cb'){ threadAction(v); return; }
  else if(a==='waiting') S.waiting=!S.waiting;
  else if(a==='sopen') S.searchMode=true;
  else if(a==='sclose'){ S.searchMode=false; S.query=''; }
  else if(a==='qclear'){ S.query=''; }
  else if(a==='rpick'){ S.query=S.recents[+v]; }
  else if(a==='rdel'){ S.recents.splice(+v,1); }
  else if(a==='rclear'){ S.recents=[]; }
  else if(a==='seeall'){ S.filter='all'; S.stack.push('cat:'+v); }
  else if(a==='filter') S.filter=v;
  else if(a==='topics') S.topicsSheet=true;
  else if(a==='topic'){ const tp=S.topics.find(x=>x.n===v); tp.on=tp.on?0:1; }
  else if(a==='tuck') S.tuckSheet=true;
  else if(a==='copy') toast('Copied');
  else if(a==='creator'){ S.sheet=null; S.searchMode=false; S.stack.push('cr:'+v); }
  else if(a==='label'){ const k=v.split(':')[0],id=v.slice(v.indexOf(':')+1); S.label={kind:k,id}; S.labelDraft=k==='res'?(findRes(id).alias||''):(S.alias[id]||''); }
  else if(a==='lfill'){ S.labelDraft=v; render(false); const i=document.getElementById('lin'); if(i){i.focus();i.setSelectionRange(v.length,v.length);} return; }
  else if(a==='lsave'||a==='lremove'){ const d=a==='lremove'?'':S.labelDraft.trim(); if(S.label.kind==='res'){ findRes(S.label.id).alias=d||undefined; } else if(d) S.alias[S.label.id]=d; else delete S.alias[S.label.id]; S.label=null; toast(d?'Label saved':'Label removed'); }
  else if(a==='lclose') S.label=null;
  else if(a==='pending') S.pendingOpen=!S.pendingOpen;
  else if(a==='pchat'){ const p=S.data.pending.find(x=>x.id===v); S.stack=['inbox','stuff','chat:'+p.by.replace('@','')]; S.hl=false; }
  else if(a==='card'){ if(ct){ clearTimeout(ct); ct=null; pin(v); render(); return; } ct=setTimeout(()=>{ ct=null; S.sheet=v; render(); },240); return; }
  else if(a==='close'){ S.sheet=null; S.comments=false; S.topicsSheet=false; S.tuckSheet=false; }
  else if(a==='pin') pin(v);
  else if(a==='open'){ const r=findRes(v); toast('Opening '+(r?(r.expands||r.link):'link')); }
  else if(a==='gochat'){ const r=findRes(v); S.sheet=null; S.searchMode=false; S.stack=['inbox','stuff','chat:'+r.by.replace('@','')]; S.hl=true; if(r.by==='@fitwithtara') S.msgs=T3(); }
  else if(a==='follow'){ const g=S.data.gated.find(x=>x.id===v); g.state='sent'; setTimeout(()=>unlock(v),1800); }
  render();
});
scr.addEventListener('input',e=>{
  if(e.target.id==='q'){ S.query=e.target.value; const p=e.target.selectionStart; render(false); const q=document.getElementById('q'); q.focus(); q.setSelectionRange(p,p); }
  if(e.target.id==='lin'){ S.labelDraft=e.target.value; const p=e.target.selectionStart; render(false); const l=document.getElementById('lin'); l.focus(); l.setSelectionRange(p,p); }
  if(e.target.id==='cin'){ S.draft=e.target.value; const p=e.target.selectionStart; render(false); const i=document.getElementById('cin'); i.focus(); i.setSelectionRange(p,p); }
});
scr.addEventListener('keydown',e=>{
  if(e.target.id==='q'&&e.key==='Enter'){ const q=S.query.trim(); if(q&&!S.recents.includes(q)){ S.recents.unshift(q); S.recents=S.recents.slice(0,6); toast('Saved to recent searches'); render(); } }
  if(e.target.id==='lin'&&e.key==='Enter'){ scr.querySelector('[data-a=lsave]').click(); }
  if(e.target.id==='cin'&&e.key==='Enter'){ scr.querySelector('[data-a=post]').click(); }
});
function pin(id){ const r=findRes(id); if(!r) return; r.pinned=!r.pinned; toast(r.pinned?"Pinned. It'll stay at the top.":'Unpinned'); }
function unlock(id){ const i=S.data.gated.findIndex(x=>x.id===id); if(i<0) return; const g=S.data.gated.splice(i,1)[0]; S.data.res.push(g.res); toast("Unlocked. It's in Recent."); render(); }

/* ---------- panel: story + concept index ---------- */
const AFTER={mode:'after',following:true,msgs:T3()};
const STORY=[
 ['Feed',()=>reset({stack:['feed']})],
 ['Comment on the reel',()=>reset({stack:['feed'],comments:true})],
 ['Creator auto-reply + DM arrives',()=>reset({stack:['feed'],comments:true,commented:true,replied:true,postedText:'GUIDE',notif:'reply',msgs:T0()})],
 ['Automation thread opens',()=>reset({stack:['feed','inbox','chat:fitwithtara'],commented:true,replied:true,msgs:T0()})],
 ['Follow gate',()=>reset({stack:['feed','inbox','chat:fitwithtara'],commented:true,replied:true,msgs:T1()})],
 ['Link delivered, then "Sent ✨"',()=>reset({stack:['feed','inbox','chat:fitwithtara'],commented:true,replied:true,following:true,msgs:T2()})],
 ['Weeks later: flooded inbox',()=>reset({mode:'before',stack:['inbox'],commented:true,msgs:T3()})],
 ['Hunting for Emily',()=>reset({mode:'before',stack:['inbox'],flash:'emily',msgs:T3()})],
 ['Digging for the link',()=>reset({mode:'before',stack:['inbox','chat:fitwithtara'],following:true,msgs:T3()})],
 ['With DM to Link: friends first',()=>reset(Object.assign({stack:['inbox']},AFTER))],
 ['DM to Link',()=>reset(Object.assign({stack:['inbox','stuff']},AFTER))],
 ['Resource card',()=>reset(Object.assign({stack:['inbox','stuff'],sheet:'r6'},AFTER))],
 ['Go to chat',()=>reset(Object.assign({stack:['inbox','stuff','chat:fitwithtara'],hl:true},AFTER))]
];
const EXTRA=[
 ['Search and browse',[
  ['—','Recent searches (delete one)',()=>reset(Object.assign({stack:['inbox','stuff'],searchMode:true},AFTER))],
  ['—','Search by memory',()=>reset(Object.assign({stack:['inbox','stuff'],searchMode:true,query:'that pasta thing'},AFTER))],
  ['—','See all: Cooking',()=>reset(Object.assign({stack:['inbox','stuff','cat:Cooking']},AFTER))],
  ['—','Customize topics',()=>reset(Object.assign({stack:['inbox','stuff'],topicsSheet:true},AFTER))],
  ['—','Noise tucked away',()=>reset(Object.assign({stack:['inbox','stuff'],tuckSheet:true},AFTER))]],'v1'],
 ['Edge cases',[
  ['E1','Waiting on you',()=>reset(Object.assign({stack:['inbox','stuff']},AFTER))],
  ['E2','Gated resource (tap "I\'m following")',()=>reset(Object.assign({stack:['inbox','stuff'],waiting:true},AFTER))],
  ['E3','No link sent',()=>reset(Object.assign({stack:['inbox','stuff'],sheet:'r9'},AFTER))],
  ['—','Link found in text',()=>reset(Object.assign({stack:['inbox','stuff'],sheet:'r7'},AFTER))],
  ['—','Shortened link',()=>reset(Object.assign({stack:['inbox','stuff'],sheet:'r8'},AFTER))],
  ['—','Link found in a button',()=>reset(Object.assign({stack:['inbox','stuff'],sheet:'r6'},AFTER))],
  ['—','Resource typed in the message',()=>reset(Object.assign({stack:['inbox','stuff'],sheet:'r19'},AFTER))],
  ['—','Two links in one message',()=>reset(Object.assign({stack:['inbox','stuff'],sheet:'r3'},AFTER))],
  ['—','No link yet (typed gate, no button)',()=>reset(Object.assign({stack:['inbox','stuff'],pendingOpen:true},AFTER))],
  ['—','Pin (double-click a card)',()=>reset(Object.assign({stack:['inbox','stuff']},AFTER))]],'v1'],
 ['Labels and creators',[
  ['—','Creators you engaged with: See all',()=>reset(Object.assign({stack:['inbox','stuff','cat:Creators']},AFTER))],
  ['—','Creator page, 3 resources',()=>reset(Object.assign({stack:['inbox','stuff','cr:@15minkitchen']},AFTER))],
  ['—','Label a resource',()=>reset(Object.assign({stack:['inbox','stuff'],sheet:'r6',label:{kind:'res',id:'r6'},labelDraft:''},AFTER))],
  ['—','Label a creator',()=>reset(Object.assign({stack:['inbox','stuff','cr:@fitwithtara'],label:{kind:'cr',id:'@fitwithtara'},labelDraft:''},AFTER))],
  ['—','Labels applied',()=>{ reset(Object.assign({stack:['inbox','stuff'],alias:{'@fitwithtara':'Tara (gym)','@15minkitchen':'Quick dinners'}},AFTER)); S.data.res.find(r=>r.id==='r6').alias='Glute plan'; S.data.res.find(r=>r.id==='r5').alias='that pasta thing'; }]],'v1']
];
let FI=[];
function panel(){
  const p=document.getElementById('panel'); FI=[];
  const reg=fn=>{FI.push(fn);return FI.length-1;};
  const nextI=S.step===null?0:Math.min(S.step+1,STORY.length-1);
  p.innerHTML=`<button class="pclose" data-mm="close">Close</button><h1>creatorDM</h1><p class="sub">DM to Link: creator links that stop burying your friends. Starts where a real creator interaction starts, in the feed.</p>
  <div class="lab">Theme</div><div class="seg"><button class="${THEME==='dark'?'on':''}" data-th="dark">Dark</button><button class="${THEME==='light'?'on':''}" data-th="light">Light</button></div>
  <div class="lab">Inbox shows</div><div class="seg"><button class="${S.mode==='before'?'on':''}" data-m="before">Before</button><button class="${S.mode==='after'?'on':''}" data-m="after">After (DM to Link)</button></div>
  <h2>The story</h2><button class="next" data-n="${nextI}">${S.step===null?'Start: open the feed':S.step>=STORY.length-1?'Restart':'Next: '+STORY[nextI][0]}</button>
  <div class="idx">${STORY.map(([n],i)=>`<button class="${S.step===i?'cur':''}" data-s="${i}"><b>${i+1}</b>${n}</button>`).join('')}</div>
  ${EXTRA.map(([g,items])=>`<h2>${g}</h2><div class="idx">${items.map(([k,n,fn])=>`<button data-f="${reg(fn)}"><b>${k}</b>${n}</button>`).join('')}</div>`).join('')}
  <p class="foot">Tap through the feed, comment sheet, thread buttons, the floating DM to Link banner, cards, See all, search and sheets. Double-click a card to pin it. The DM thread follows a real comment-to-DM automation, noise included. Educational concept by Archana Raghu Prasad. Not affiliated with Meta. Handles and people are invented.</p>`;
  const nx=document.querySelector('#mbar .nx'); if(nx) nx.textContent=S.step===null?'Start the story':S.step>=STORY.length-1?'Restart':'Next: '+STORY[nextI][0];
}
document.getElementById('panel').addEventListener('click',e=>{
  const th=e.target.closest('[data-th]'); if(th){ THEME=th.dataset.th; render(); return; }
  const m=e.target.closest('[data-m]'); if(m){ S.mode=m.dataset.m; render(); return; }
  const n=e.target.closest('[data-n]'); if(n){ const i=+n.dataset.n; if(S.step!==null&&S.step>=STORY.length-1){ STORY[0][1](); S.step=0; } else { STORY[i][1](); S.step=i; } render(false); return; }
  const s=e.target.closest('[data-s]'); if(s){ const i=+s.dataset.s; STORY[i][1](); S.step=i; render(false); return; }
  const f=e.target.closest('[data-f]'); if(f){ FI[+f.dataset.f](); S.step=null; render(false); }
});
function fit(){ const el=document.getElementById('scaler');
  if(matchMedia('(max-width:820px)').matches){ const s=Math.min(1,(innerHeight-28-56)/874,innerWidth/402); el.style.transform=`scale(${s})`; el.style.margin=`${(874*s-874)/2}px ${(402*s-402)/2}px`; }
  else { const s=Math.min(1,(innerHeight-24)/894,(innerWidth-310-24)/422); el.style.transform=`scale(${s})`; el.style.margin=`${(894*s-894)/2}px ${(422*s-422)/2}px`; } }
function nextStep(){ if(S.step!==null&&S.step>=STORY.length-1){ STORY[0][1](); S.step=0; } else { const i=S.step===null?0:S.step+1; STORY[i][1](); S.step=i; } render(false); }
document.getElementById('mbar').addEventListener('click',e=>{ const b=e.target.closest('[data-mm]'); if(!b) return; if(b.dataset.mm==='menu') document.body.classList.add('menu-open'); else if(b.dataset.mm==='next') nextStep(); });
document.getElementById('panel').addEventListener('click',e=>{ if(e.target.closest('[data-mm=close],[data-s],[data-n],[data-f]')) document.body.classList.remove('menu-open'); });
if(/menu/.test(location.search)) document.body.classList.add('menu-open');
addEventListener('resize',fit); fit(); render();
{ const n=parseInt(location.hash.slice(1),10); if(!isNaN(n)&&STORY[n]){ STORY[n][1](); S.step=n; render(false); }
  const x=location.hash.match(/^#x(\d+)/); if(x&&FI[+x[1]]){ FI[+x[1]](); render(false); }
  if(/light/.test(location.search)){ THEME='light'; render(); } } // #0..#12 story step, #x0.. extras, ?light

/* ---------- shot mode (?shot=N): one bare screen at 402x874, for PDF and Figma captures ---------- */
{ const m=location.search.match(/shot=(\d+)/); if(m){ const CAPS=STORY.map(([n,fn])=>[n,fn]).concat(EXTRA.flatMap(([g,items])=>items.map(([k,n,fn])=>[g+': '+n,fn])));
  const cap=CAPS[+m[1]]; if(cap){ cap[1](); document.body.classList.add('shot'); const w=document.createElement('div'); w.className='screen'; w.dataset.t=/light/.test(location.search)?'light':'dark'; w.style.borderRadius='0'; w.innerHTML=markup(); document.body.appendChild(w);
    const b=w.querySelector('.body'); if(b&&cur().startsWith('chat:')&&!S.hl) b.scrollTop=b.scrollHeight; const fl=w.querySelector('#hlmsg'); if(fl&&S.hl) fl.scrollIntoView({block:'center'});
    const sc=location.search.match(/scroll=(\d+)/); if(sc&&b) b.scrollTop=+sc[1]; } } }

/* ---------- board mode (?board): every screen side by side, for one-shot capture into Figma ---------- */
if(/board/.test(location.search)){
  document.body.classList.add('board');
  const CAPS=STORY.map(([n,fn])=>[n,fn]).concat(EXTRA.flatMap(([g,items])=>items.map(([k,n,fn])=>[g+': '+n,fn])));
  const wrap=document.createElement('div'); wrap.className='boardwrap'; document.body.appendChild(wrap);
  CAPS.forEach(([n,fn],i)=>{
    fn(); const cell=document.createElement('div'); cell.className='cell';
    cell.innerHTML=`<div class="bl">${i+1}. ${n}</div><div class="screen" data-t="${THEME}" style="border-radius:0">${markup()}</div>`;
    wrap.appendChild(cell);
    const b=cell.querySelector('.body'); if(b&&cur().startsWith('chat:')&&!S.hl) b.scrollTop=b.scrollHeight;
    const fl=cell.querySelector('#hlmsg'); if(fl&&S.hl) fl.scrollIntoView({block:'center'});
  });
}
