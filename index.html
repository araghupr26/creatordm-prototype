const colorOf=id=>{ const r=S.data.res.find(x=>handle(x.by)===id)||(S.data.gated.find(x=>handle(x.by)===id)||{}).res||(S.data.pending.find(x=>handle(x.by)===id)||{}).res; return r?r.color:'coral'; };
const follows=id=>id==='fitwithtara'?S.following:!!(S.followed[id]||S.data.res.some(r=>handle(r.by)===id&&(r.pat==='gate'||r.pat==='gate2')));

const epHead=(by,date,i,key)=>[{k:'date',t:`${date.toUpperCase()}, ${TIMES[(hashOf(key)+i)%TIMES.length]}`},{k:'sys',by}];
const deliveredMsg=r=>r.src==='msg'?{k:'in',lines:r.lines,rid:r.id}:r.src==='text'?{k:'in',t:r.said,lt:r.link,rid:r.id}:{k:'in',t:r.said,b:[{l:r.btn||'Open it',a:'open',id:r.id}],rid:r.id};
function episode(r,i){ const g=GREET[hashOf(r.id)%GREET.length]; const out=t=>({k:'out',t}); const del=deliveredMsg(r);
  const gb=()=>[{l:'Visit Profile',a:'visit'},{l:"I'm following ✅",a:'following'}]; const hello=()=>({k:'in',t:g,b:[{l:'Send me the access',a:'x'}]});
  let m;
  if(r.pat==='tap') m=[hello(),out('Send me the access'),del];
  else if(r.pat==='keyword') m=[{k:'in',t:"Thanks for the comment! 🙌 Reply YES and I'll send it over."},out('YES'),del];
  else if(r.pat==='gate') m=[hello(),out('Send me the access'),{k:'in',t:GATE,b:gb()},out("I'm following ✅"),del];
  else if(r.pat==='gate2') m=[hello(),out('Send me the access'),{k:'in',t:GATE,b:gb()},out("I'm following ✅"),{k:'in',t:REGATE,b:gb()},out("I'm following ✅"),del];
  else if(r.pat==='reply') m=[{k:'in',t:"Thanks for commenting! Reply with your email and I'll send it over 📩"},out(r.replyText||'jordan.w@example.com'),del];
  else m=[del];
  const tail=[]; if(r.noise.after>0){ tail.push({k:'date',t:r.ago<=1?'LATER':r.ago<8?'2 DAYS LATER':'1 WEEK LATER'}); for(let n=0;n<r.noise.after;n++) tail.push({k:'in',t:FOLLOWUPS[(hashOf(r.id)+n)%FOLLOWUPS.length],noise:true}); }
  return epHead(r.by,r.date,i,r.id).concat(m,tail); }
function gatedEpisode(g,i){ const gr=GREET[hashOf(g.id)%GREET.length]; const m=[{k:'in',t:gr,b:[{l:'Send me the access',a:'x'}]},{k:'out',t:'Send me the access'}];
  const gates=1+(g.taps||0);
  for(let n=0;n<gates;n++){ m.push({k:'in',t:n===0?GATE:REGATE,b:[{l:'Visit Profile',a:'visit'},{l:"I'm following ✅",a:'following'}]}); if(n<gates-1) m.push({k:'out',t:"I'm following ✅"}); }
  if(g.state==='sent') m.push({k:'out',t:"I'm following ✅"}); else { const last=m[m.length-1]; last.live=true; last.gid=g.id; }
  return epHead(g.by,g.res.date,i,g.id).concat(m); }
const askEpisode=(p,i)=>epHead(p.by,p.date,i,p.id).concat([{k:'in',t:p.ask,ask:true}]);
const ackEpisode=(w,i)=>epHead(w.by,w.date,i,w.id).concat([{k:'in',t:'Thanks! Your link is on the way ⏳'}]);
function buildThread(id){ const by='@'+id; const eps=[];
  S.data.res.filter(r=>r.by===by).forEach(r=>eps.push({ago:r.ago,b:i=>episode(r,i)}));
  S.data.gated.filter(g=>g.by===by).forEach(g=>eps.push({ago:g.res.ago,b:i=>gatedEpisode(g,i)}));
  S.data.pending.filter(p=>p.by===by).forEach(p=>eps.push({ago:p.ago,b:i=>askEpisode(p,i)}));
  S.data.waiting.filter(w=>w.by===by).forEach(w=>eps.push({ago:w.ago,b:i=>ackEpisode(w,i)}));
  eps.sort((a,b)=>b.ago-a.ago); let msgs=[]; eps.forEach((e,i)=>{ msgs=msgs.concat(e.b(i)); });
  return msgs.concat(S.sent[id]||[]); }

function chat(id){
  const all=[...S.data.friends,...S.data.creators]; const th=all.find(x=>x.id===id)||{id,name:id,c:colorOf(id),pv:'',t:''};
  const creator=!S.data.friends.some(x=>x.id===id); const story=id==='fitwithtara';
  const msgs=story?(S.msgs.length?S.msgs:T3()):(creator?buildThread(id):friendThread(th));
  const lastBtn=msgs.map((m,i)=>m.b&&m.k==='in'?i:-1).reduce((a,b)=>Math.max(a,b),-1);
  const lastOut=msgs.map((m,i)=>m.k==='out'?i:-1).reduce((a,b)=>Math.max(a,b),-1);
  const inner=msgs.map((m,i)=>{
    if(m.k==='date') return `<div class="date">${m.t}</div>`;

    if(m.k==='out') return `<div class="out">${m.t}</div>`;
    if(m.k==='typing') return `<div class="inr"><div class="sp"></div><div class="b typing"><i></i><i></i><i></i></div></div>`;
    const active=story?!!(m.b&&i===lastBtn&&lastOut<i&&S.msgs.length):!!m.live;
    const next=msgs[i+1]; const showAv=!(next&&next.k==='in');
    const hlOn=!!((m.hl&&S.hl)||(m.rid&&S.hlId===m.rid));
    const body=m.lines?m.lines.map(l=>l.u?`• ${l.t}: <a class="ulk" data-a="openurl" data-v="${l.u}">${l.u}</a>`:l.t).join('<br>'):(m.lt?m.t.replace(m.lt,`<a class="ulk" data-a="openurl" data-v="${m.lt}">${m.lt}</a>`):m.t);
    const btns=m.b?`<div class="bt">${m.b.map(b=>`<button class="${active?'':'off'}" ${active?(story?`data-a="cb" data-v="${b.a}"`:`data-a="gb" data-v="${b.a}:${m.gid||b.id||''}"`):''}>${b.l}</button>`).join('')}</div>`:'';
    return `<div class="inr">${showAv?av(th.name,th.c,28):'<div class="sp"></div>'}<div class="stk"><div class="b ${hlOn?'hl':''} ${m.noise?'noise':''}" ${hlOn?'id="hlmsg"':''}>${body}${btns}</div>${m.noise&&S.mode==='after'?`<div class="nt">${ic('check',11,'var(--tx2)')}Tucked away in DM to Link</div>`:''}</div></div>`;
  }).join('');
  const fol=follows(id);
  const intro=creator?`<div class="intro">${av(th.name,th.c,84,true)}<b>${th.name}</b><div class="h">${th.name}</div><div class="h">7.5K followers · 53 posts</div><div class="h">${fol?'You follow this account':"You don't follow each other on Instagram"}</div><button class="fbtn ${fol?'on':''}" data-a="follow-t" data-v="@${id}">${fol?'Following':'Follow'}</button></div>`:'';
  return `<div class="col">${status()}<div class="hdr" style="gap:14px"><button data-a="back">${ic('back',26)}</button>${av(th.name,th.c,40,creator)}<div class="cname"><b>${th.name}</b><span>${creator?th.name:'Active now'}</span></div>${ic('plusc',26)}${ic('phone',24)}${ic('video',26)}</div>
  ${creator?`<div class="pills"><button>Inquire</button><button data-a="profile" data-v="@${id}">View Profile</button></div>`:''}
  <div class="body" id="body" style="padding-bottom:110px">${intro}<div class="msgs">${inner}</div></div></div>
  <div class="inputbar"><span class="cam">${ic('camera',22,'#fff')}</span><input id="msgin" placeholder="Message…" autocomplete="off">${ic('mic',24,'var(--tx)')}${ic('image',24,'var(--tx)')}${ic('sticker',24,'var(--tx)')}${ic('plusc',26,'var(--tx)')}</div>`;
}
const host=u=>u.split('/')[0];
const linkify=(r,txt)=>r.src==='text'?txt.replace(r.link,`<a class="ulk" data-a="openurl" data-v="${r.link}">${r.link}</a>`):txt;
function sheet(){
  const r=findRes(S.sheet); if(!r) return ''; const isMsg=r.src==='msg'; const nz=r.noise.after; const kind=r.type==='reel'?'Reel':'Post'; const nres=S.data.res.filter(x=>x.by===r.by).length;

  <div><div class="tt">${rt(r)}</div><div class="fr">${r.alias?'Original: '+r.title+' · ':''}${kind} from ${dn(r.by)}, ${r.date}${r.tags.length?' · '+r.tags.join(', '):''}</div></div><div class="lr"><button data-a="label" data-v="res:${r.id}">${ic('compose',14,'var(--tx)')}Rename</button><button data-a="creator" data-v="${r.by}">${ic('profile',14,'var(--tx)')}${dn(r.by)} · ${nres} resource${nres>1?'s':''}</button></div>

  <button class="btn o" data-a="pin" data-v="${r.id}">${r.pinned?'Pinned':'Pin'}</button></div>`;
}
const topicsSheet=()=>`<div class="scrim" data-a="close"></div><div class="sheet"><div class="hd"></div><div class="ttl2">Your topics</div><div class="cp">Topics come from the reels and posts you comment on. Turn any off to hide its row.</div><div class="tg">${S.topics.map(t=>`<button class="${t.on?'on':''}" data-a="topic" data-v="${t.n}">${t.on?ic('check',14,'currentColor'):''}${t.n}</button>`).join('')}</div><button class="btn p" data-a="close">Done</button></div>`;
const tuckSheet=()=>`<div class="scrim" data-a="close"></div><div class="sheet"><div class="hd"></div><div class="ttl2">Tucked away</div><div class="cp">DM to Link tucks away what a creator sends after your link arrives: confirmations, follow-ups and promos. Nothing is deleted. Each message is still in its chat.</div>

/* ---------- render + events ---------- */
function markup(){
  const c=cur(); let h='';
  if(c==='feed')h=feed(); else if(c==='inbox')h=inbox(); else if(c==='stuff')h=stuff(); else if(c.startsWith('cat:'))h=seeall(c.slice(4)); else if(c.startsWith('cr:'))h=creatorScreen(c.slice(3)); else if(c.startsWith('chat:'))h=chat(c.slice(5));
  const notif=S.notif==='reply'?`<div class="notif" data-a="opennotif">${av('fitwithtara','coral',40,true)}<div class="m"><b>fitwithtara</b> replied to your comment: ${VAR.reply[1]}<div class="n">now</div></div></div>`:'';
  return `<div class="island"></div>${h}${S.comments?commentsSheet():''}${S.sheet?sheet():''}${S.topicsSheet?topicsSheet():''}${S.label?labelSheet():''}${S.profile?profileSheet():''}${S.tuckSheet?tuckSheet():''}${notif}${S.toast?`<div class="toast">${S.toast}</div>`:''}`;
}
function render(keep=true){
  const scr=document.getElementById('screen'); scr.dataset.t=THEME;
  const old=document.getElementById('body'); const st=old&&keep?old.scrollTop:0; const c=cur();
  scr.innerHTML=markup();
  const b=document.getElementById('body'); if(b) b.scrollTop=st;
  if(c.startsWith('chat:')&&b&&!S.hl) b.scrollTop=b.scrollHeight;
  if(S.flash){ const el=document.querySelector(`[data-id="${S.flash}"]`); if(el) el.scrollIntoView({block:'center'}); }
  if(S.hl){ const el=document.getElementById('hlmsg'); if(el) el.scrollIntoView({block:'center'}); }
  if(S.focusPost&&b){ const fp=document.getElementById('post-'+S.focusPost); if(fp) b.scrollTop=fp.offsetTop-12; }
  if(S.focusMsg){ S.focusMsg=false; const mi=document.getElementById('msgin'); if(mi) mi.focus(); }
  if(S.autotype){ const txt=S.autotype; S.autotype=null; let n=0; const s0=S; const tick=()=>{ if(S!==s0||!S.comments) return; n++; S.draft=txt.slice(0,n); render(false); if(n<txt.length) setTimeout(tick,140); }; setTimeout(tick,500); }
  if(S.msearch){ const mq=document.getElementById('mq'); if(mq&&document.activeElement!==mq){ mq.focus(); mq.setSelectionRange(mq.value.length,mq.value.length); } }
  if(S.searchMode){ const q=document.getElementById('q'); if(q&&document.activeElement!==q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
  if(S.label){ const l=document.getElementById('lin'); if(l&&document.activeElement!==l){ l.focus(); l.setSelectionRange(l.value.length,l.value.length); } }
  panel();
}
const scr=document.getElementById('screen');
scr.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return; const a=t.dataset.a,v=t.dataset.v;
  if(a==='go') S.stack.push(v);
  else if(a==='tab'){ if(v==='home') S.stack=['feed']; else if(v==='inbox') S.stack=['inbox']; else toast('Not part of this prototype'); S.notif=null; S.sheet=null; S.comments=false; S.searchMode=false; S.msearch=false; }
  else if(a==='back'){ if(S.stack.length>1) S.stack.pop(); S.hl=false; S.hlId=null; }
  else if(a==='chat'){ S.stack.push('chat:'+v); S.hl=false; S.hlId=null; if(v==='fitwithtara'){ S.openedFit=true; if(!S.msgs.length) S.msgs=T3(); } }
  else if(a==='comments'){ S.comments=true; S.notif=null; }
  else if(a==='fill'){ S.draft=v; render(false); const i=document.getElementById('cin'); if(i){i.focus();i.setSelectionRange(v.length,v.length);} return; }
  else if(a==='post'){ if(!S.draft.trim()) return; S.postedText=S.draft.trim(); const hit=/guide/i.test(S.postedText); S.commented=true; S.draft='';
    if(hit){ S.msgs=T0(); later(()=>{S.replied=true;render();},900); later(()=>{S.notif='reply';render();},1800); later(()=>{S.dmIn=true;render();},3400); } else toast('Posted'); }
  else if(a==='opennotif'){ S.notif=null; S.comments=true; }
  else if(a==='seepost') S.stack=['feed'];
  else if(a==='follow-t') toggleFollow(v);
  else if(a==='cb'){ threadAction(v); return; }
  else if(a==='waiting') S.waiting=!S.waiting;
  else if(a==='sopen') S.searchMode=true;
  else if(a==='sclose'){ S.searchMode=false; S.query=''; }
  else if(a==='qclear'){ S.query=''; }
  else if(a==='rpick'){ S.query=S.recents[+v]; }
  else if(a==='rdel'){ S.recents.splice(+v,1); }
  else if(a==='rclear'){ S.recents=[]; }
  else if(a==='seeall'){ S.filter='all'; S.stack.push('cat:'+v); }
  else if(a==='filter') S.filter=v;
  else if(a==='topics') S.topicsSheet=true;
  else if(a==='topic'){ const tp=S.topics.find(x=>x.n===v); tp.on=tp.on?0:1; }
  else if(a==='tuck') S.tuckSheet=true;
  else if(a==='openurl') toast('Opening '+v);
  else if(a==='gb'){ const sp=v.split(':'); if(sp[0]==='visit') S.profile='@'+cur().slice(5); else if(sp[0]==='following') tapFollowing(sp[1]); else if(sp[0]==='open'){ const r=findRes(sp[1]); toast('Opening '+(r?r.link:'link')); } }
  else if(a==='pfollow') toggleFollow(v);
  else if(a==='pclose') S.profile=null;
  else if(a==='capmore') S.capOpen=S.capOpen===v?null:v;
  else if(a==='profile') S.profile=v;
  else if(a==='waitlink') S.waitLink=!S.waitLink;
  else if(a==='pchat2'){ S.stack=['inbox','stuff','chat:'+v.replace('@','')]; S.hl=false; }
  else if(a==='msopen') S.msearch=true;
  else if(a==='msclose'){ S.msearch=false; S.mq=''; }
  else if(a==='mqclear') S.mq='';
  else if(a==='creator'){ S.sheet=null; S.searchMode=false; S.stack.push('cr:'+v); }
  else if(a==='label'){ const id=v.slice(v.indexOf(':')+1); S.label={kind:'res',id}; S.labelDraft=findRes(id).alias||''; }
  else if(a==='lfill'){ S.labelDraft=v; render(false); const i=document.getElementById('lin'); if(i){i.focus();i.setSelectionRange(v.length,v.length);} return; }
  else if(a==='lsave'||a==='lremove'){ const d=a==='lremove'?'':S.labelDraft.trim(); findRes(S.label.id).alias=d||undefined; S.label=null; toast(d?'Renamed':'Name removed'); }
  else if(a==='lclose') S.label=null;
  else if(a==='pchat'){ const p=S.data.pending.find(x=>x.id===v); S.stack=['inbox','stuff','chat:'+p.by.replace('@','')]; S.hl=false; S.hlId=null; S.focusMsg=true; }
  else if(a==='card'){ if(ct){ clearTimeout(ct); ct=null; pin(v); render(); return; } ct=setTimeout(()=>{ ct=null; S.sheet=v; render(); },240); return; }
  else if(a==='close'){ S.sheet=null; S.comments=false; S.topicsSheet=false; S.tuckSheet=false; }
  else if(a==='pin') pin(v);
  else if(a==='open'){ const r=findRes(v); toast('Opening '+(r?r.link:'link')); }
  else if(a==='gochat'){ const r=findRes(v); S.sheet=null; S.searchMode=false; S.stack=['inbox','stuff','chat:'+r.by.replace('@','')]; S.hl=true; S.hlId=r.id; if(r.by==='@fitwithtara') S.msgs=T3(); }
  else if(a==='follow') tapFollowing(v);
  render();
});
scr.addEventListener('input',e=>{
  if(e.target.id==='q'){ S.query=e.target.value; const p=e.target.selectionStart; render(false); const q=document.getElementById('q'); q.focus(); q.setSelectionRange(p,p); }
  if(e.target.id==='mq'){ S.mq=e.target.value; const p=e.target.selectionStart; render(false); const m=document.getElementById('mq'); m.focus(); m.setSelectionRange(p,p); }
  if(e.target.id==='lin'){ S.labelDraft=e.target.value; const p=e.target.selectionStart; render(false); const l=document.getElementById('lin'); l.focus(); l.setSelectionRange(p,p); }
  if(e.target.id==='cin'){ S.draft=e.target.value; const p=e.target.selectionStart; render(false); const i=document.getElementById('cin'); i.focus(); i.setSelectionRange(p,p); }
});
scr.addEventListener('keydown',e=>{
  if(e.target.id==='q'&&e.key==='Enter'){ const q=S.query.trim(); if(q&&!S.recents.includes(q)){ S.recents.unshift(q); S.recents=S.recents.slice(0,6); toast('Saved to recent searches'); render(); } }
  if(e.target.id==='lin'&&e.key==='Enter'){ scr.querySelector('[data-a=lsave]').click(); }
  if(e.target.id==='cin'&&e.key==='Enter'){ scr.querySelector('[data-a=post]').click(); }
  if(e.target.id==='msgin'&&e.key==='Enter'){ sendMsg(); }
});
function pin(id){ const r=findRes(id); if(!r) return; r.pinned=!r.pinned; toast(r.pinned?"Pinned. It'll stay at the top.":'Unpinned'); }
function unlock(id){ const i=S.data.gated.findIndex(x=>x.id===id); if(i<0) return; const g=S.data.gated.splice(i,1)[0]; S.data.res.push(g.res); toast("Unlocked. It's in Recent."); render(); }

/* ---------- panel: story + concept index ---------- */
const E0={mode:'before',early:true};
const L0={mode:'before',early:false,commented:true,replied:true,dmIn:true,openedFit:true,following:true,msgs:T3()};
const AFTER=Object.assign({},L0,{mode:'after'});
const STORY=[
 ['Feed',()=>reset(Object.assign({},E0,{stack:['feed']})),'Before'],
 ['Comment on the reel',()=>reset(Object.assign({},E0,{stack:['feed'],focusPost:'p1',comments:true,autotype:'GUIDE'})),'Before'],
 ['The creator replies in the comments',()=>reset(Object.assign({},E0,{stack:['feed'],focusPost:'p1',comments:true,commented:true,replied:true,postedText:'GUIDE',notif:'reply',msgs:T0()})),'Before'],
 ['A red number appears on DMs',()=>reset(Object.assign({},E0,{stack:['feed'],focusPost:'p1',commented:true,replied:true,dmIn:true,postedText:'GUIDE',msgs:T0()})),'Before'],
 ['Open Messages: the thread is unread',()=>reset(Object.assign({},E0,{stack:['inbox'],commented:true,replied:true,dmIn:true,msgs:T0()})),'Before'],
 ['The automation thread opens',()=>reset(Object.assign({},E0,{stack:['inbox','chat:fitwithtara'],commented:true,replied:true,dmIn:true,openedFit:true,msgs:T0()})),'Before'],
 ['Follow gate',()=>reset(Object.assign({},E0,{stack:['inbox','chat:fitwithtara'],commented:true,replied:true,dmIn:true,openedFit:true,msgs:T1()})),'Before'],
 ['Link delivered',()=>reset(Object.assign({},E0,{stack:['inbox','chat:fitwithtara'],commented:true,replied:true,dmIn:true,openedFit:true,following:true,msgs:T2()})),'Before'],
 ['Weeks later: flooded inbox',()=>reset(Object.assign({},L0,{stack:['inbox']})),'Before'],
 ["A friend's message is buried",()=>reset(Object.assign({},L0,{stack:['inbox'],flash:'emily'})),'Before'],
 ['Search finds nothing',()=>reset(Object.assign({},L0,{stack:['inbox'],msearch:true,mq:'pasta'})),'Before'],
 ['Scrolling the thread to find the link',()=>reset(Object.assign({},L0,{stack:['inbox','chat:fitwithtara']})),'Before'],
 ['Friends first, DM to Link banner',()=>reset(Object.assign({},AFTER,{stack:['inbox']})),'After'],
 ['DM to Link',()=>reset(Object.assign({},AFTER,{stack:['inbox','stuff']})),'After'],
 ['Resource card',()=>reset(Object.assign({},AFTER,{stack:['inbox','stuff'],sheet:'r6'})),'After'],
 ['Go to chat',()=>reset(Object.assign({},AFTER,{stack:['inbox','stuff','chat:fitwithtara'],hl:true})),'After'],
 ['Search finds it',()=>reset(Object.assign({},AFTER,{stack:['inbox','stuff'],searchMode:true,query:'that pasta thing'})),'After']
];
const A=o=>reset(Object.assign({},AFTER,o));
const EXTRA=[
 ['Search and browse',[
  ['—','Recent searches (delete one)',()=>A({stack:['inbox','stuff'],searchMode:true})],
  ['—','See all: Cooking',()=>A({stack:['inbox','stuff','cat:Cooking']})],
  ['—','Customize topics',()=>A({stack:['inbox','stuff'],topicsSheet:true})],
  ['—','Tucked away',()=>A({stack:['inbox','stuff'],tuckSheet:true})]],'v1'],
 ['Waiting and edge cases',[
  ['—','Waiting rows, collapsed',()=>A({stack:['inbox','stuff']})],
  ['—',"Waiting on you: Open profile, I'm following",()=>A({stack:['inbox','stuff'],waiting:true})],
  ['—','Gated: checking the follow',()=>{ A({stack:['inbox','stuff'],waiting:true}); S.data.gated[0].state='sent'; }],
  ['—','Gated: unlocked',()=>{ A({stack:['inbox','stuff'],waiting:true}); const g=S.data.gated.splice(0,1)[0]; S.data.res.push(g.res); toast("Unlocked. It's in Recent."); }],
  ['—','Waiting for link',()=>A({stack:['inbox','stuff'],waitLink:true})],
  ['—','Link in a button',()=>A({stack:['inbox','stuff'],sheet:'r6'})],
  ['—','Link in the message text',()=>A({stack:['inbox','stuff'],sheet:'r7'})],
  ['—','Message with a link per bullet',()=>A({stack:['inbox','stuff'],sheet:'r19'})],
  ['—','Pin (double-click a card)',()=>{ A({stack:['inbox','stuff']}); S.data.res.find(r=>r.id==='r3').pinned=true; toast("Pinned. It'll stay at the top."); }]],'v1'],
 ['Creators and renaming',[
  ['—','Creators you engaged with: See all',()=>A({stack:['inbox','stuff','cat:Creators']})],
  ['—','Creator page, 3 resources',()=>A({stack:['inbox','stuff','cr:@15minkitchen']})],
  ['—','Rename a resource',()=>A({stack:['inbox','stuff'],sheet:'r6',label:{kind:'res',id:'r6'},labelDraft:''})],
  ['—','Renamed resources',()=>{ A({stack:['inbox','stuff']}); S.data.res.find(r=>r.id==='r6').alias='Glute plan'; S.data.res.find(r=>r.id==='r5').alias='that pasta thing'; }]],'v1']
];
let FI=[];
function panel(){
  const p=document.getElementById('panel'); FI=[];
  const reg=fn=>{FI.push(fn);return FI.length-1;};
  const nextI=S.step===null?0:Math.min(S.step+1,STORY.length-1);
  p.innerHTML=`<button class="pclose" data-mm="close">Close</button><h1>creatorDM</h1><p class="sub">DM to Link: creator links that stop burying your friends. Starts where a real creator interaction starts, in the feed.</p>
  <div class="lab">Theme</div><div class="seg"><button class="${THEME==='dark'?'on':''}" data-th="dark">Dark</button><button class="${THEME==='light'?'on':''}" data-th="light">Light</button></div>
  <div class="lab">Inbox shows</div><div class="seg"><button class="${S.mode==='before'?'on':''}" data-m="before">Before</button><button class="${S.mode==='after'?'on':''}" data-m="after">After (DM to Link)</button></div>
  <h2>The story</h2><button class="next" data-n="${nextI}">${S.step===null?'Start: open the feed':S.step>=STORY.length-1?'Restart':'Next: '+STORY[nextI][0]}</button>
  ${[['Before','Before: today\'s flow and pain points'],['After','After: with DM to Link']].map(([gk,gt])=>`<h2>${gt}</h2><div class="idx">${STORY.map(([n,fn,gg],i)=>gg===gk?`<button class="${S.step===i?'cur':''}" data-s="${i}"><b>${i+1}</b>${n}</button>`:'').join('')}</div>`).join('')}
  ${EXTRA.map(([g,items])=>`<h2>${g}</h2><div class="idx">${items.map(([k,n,fn])=>`<button data-f="${reg(fn)}"><b>${k}</b>${n}</button>`).join('')}</div>`).join('')}
  <p class="foot">Tap through the feed, comment sheet, thread buttons, the floating DM to Link banner, cards, See all, search and sheets. Double-click a card to pin it. The DM thread follows a real comment-to-DM automation, noise included. Educational concept by Archana Raghu Prasad. Not affiliated with Meta. Handles and people are invented.</p>`;
  const nx=document.querySelector('#mbar .nx'); if(nx) nx.textContent=S.step===null?'Start the story':S.step>=STORY.length-1?'Restart':'Next: '+STORY[nextI][0];
}
document.getElementById('panel').addEventListener('click',e=>{
  const th=e.target.closest('[data-th]'); if(th){ THEME=th.dataset.th; render(); return; }
  const m=e.target.closest('[data-m]'); if(m){ S.mode=m.dataset.m; render(); return; }
  const n=e.target.closest('[data-n]'); if(n){ const i=+n.dataset.n; if(S.step!==null&&S.step>=STORY.length-1){ STORY[0][1](); S.step=0; } else { STORY[i][1](); S.step=i; } render(false); return; }
  const s=e.target.closest('[data-s]'); if(s){ const i=+s.dataset.s; STORY[i][1](); S.step=i; render(false); return; }
  const f=e.target.closest('[data-f]'); if(f){ FI[+f.dataset.f](); S.step=null; render(false); }
});
function fit(){ const el=document.getElementById('scaler');
  if(matchMedia('(max-width:820px)').matches){ const s=Math.min(1,(innerHeight-28-56)/874,innerWidth/402); el.style.transform=`scale(${s})`; el.style.margin=`${(874*s-874)/2}px ${(402*s-402)/2}px`; }
  else { const s=Math.min(1,(innerHeight-24)/894,(innerWidth-310-24)/422); el.style.transform=`scale(${s})`; el.style.margin=`${(894*s-894)/2}px ${(422*s-422)/2}px`; } }
function nextStep(){ if(S.step!==null&&S.step>=STORY.length-1){ STORY[0][1](); S.step=0; } else { const i=S.step===null?0:S.step+1; STORY[i][1](); S.step=i; } render(false); }
document.getElementById('mbar').addEventListener('click',e=>{ const b=e.target.closest('[data-mm]'); if(!b) return; if(b.dataset.mm==='menu') document.body.classList.add('menu-open'); else if(b.dataset.mm==='next') nextStep(); });
document.getElementById('panel').addEventListener('click',e=>{ if(e.target.closest('[data-mm=close],[data-s],[data-n],[data-f]')) document.body.classList.remove('menu-open'); });
if(/menu/.test(location.search)) document.body.classList.add('menu-open');
addEventListener('resize',fit); fit(); render();
{ const n=parseInt(location.hash.slice(1),10); if(!isNaN(n)&&STORY[n]){ STORY[n][1](); S.step=n; render(false); }
  const x=location.hash.match(/^#x(\d+)/); if(x&&FI[+x[1]]){ FI[+x[1]](); render(false); }
  if(/light/.test(location.search)){ THEME='light'; render(); } } // #0..#12 story step, #x0.. extras, ?light

/* ---------- shot mode (?shot=N): one bare screen at 402x874, for PDF and Figma captures ---------- */
{ const m=location.search.match(/shot=(\d+)/); if(m){ const CAPS=STORY.map(([n,fn])=>[n,fn]).concat(EXTRA.flatMap(([g,items])=>items.map(([k,n,fn])=>[g+': '+n,fn])));
  const cap=CAPS[+m[1]]; if(cap){ cap[1](); document.body.classList.add('shot'); const w=document.createElement('div'); w.className='screen'; w.dataset.t=/light/.test(location.search)?'light':'dark'; w.style.borderRadius='0'; if(S.autotype){S.draft=S.autotype;S.autotype=null;} w.innerHTML=markup(); document.body.appendChild(w);
    const b=w.querySelector('.body'); if(b&&cur().startsWith('chat:')&&!S.hl) b.scrollTop=b.scrollHeight; { const fp=S.focusPost&&w.querySelector('#post-'+S.focusPost); if(fp&&b) b.scrollTop=fp.offsetTop-12; } const fl=w.querySelector('#hlmsg'); if(fl&&S.hl) fl.scrollIntoView({block:'center'});
    const sc=location.search.match(/scroll=(\d+)/); if(sc&&b) b.scrollTop=+sc[1]; } } }

/* ---------- board mode (?board): every screen side by side, for one-shot capture into Figma ---------- */
if(/board/.test(location.search)){
  document.body.classList.add('board');
  const CAPS=STORY.map(([n,fn])=>[n,fn]).concat(EXTRA.flatMap(([g,items])=>items.map(([k,n,fn])=>[g+': '+n,fn])));
  const wrap=document.createElement('div'); wrap.className='boardwrap'; document.body.appendChild(wrap);
  CAPS.forEach(([n,fn],i)=>{
    fn(); if(S.autotype){S.draft=S.autotype;S.autotype=null;} const cell=document.createElement('div'); cell.className='cell';
    cell.innerHTML=`<div class="bl">${i+1}. ${n}</div><div class="screen" data-t="${THEME}" style="border-radius:0">${markup()}</div>`;
    wrap.appendChild(cell);
    const b=cell.querySelector('.body'); if(b&&cur().startsWith('chat:')&&!S.hl) b.scrollTop=b.scrollHeight; { const fp=S.focusPost&&cell.querySelector('#post-'+S.focusPost); if(fp&&b) b.scrollTop=fp.offsetTop-12; }
    const fl=cell.querySelector('#hlmsg'); if(fl&&S.hl) fl.scrollIntoView({block:'center'});
  });
}
